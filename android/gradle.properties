# 4g: Chaquopy's pip step plus AGP's dexer are both memory-hungry, and the
# default 512m OOMs once the native wheels (numpy/Pillow/lxml/cryptography) are
# in the mix.
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8

org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# NOTE: org.gradle.java.home is deliberately NOT set here — it would hardcode
# one machine's JDK path into a checked-in file. This project needs a JDK 17-21
# to build (AGP 8.13). If your default `java` is outside that range, set
# JAVA_HOME for the invocation only; android/README.md has the command.
