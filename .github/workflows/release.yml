# ─────────────────────────────────────────────────────────────────────────────
# Release workflow — build the AIO Downloader Electron app on three OSes.
#
# Triggers:
#   - push of any tag matching v*  (cuts a draft GitHub Release)
#   - manual workflow_dispatch     (also cuts a draft release — tag is
#                                   either provided via the `tag_name`
#                                   input or auto-derived from the
#                                   commit's date-version + timestamp)
#
# Jobs:
#   guard   — cheap duplicate-run filter, see DOUBLE-RUN below.
#   build   — matrix over windows-latest / macos-latest / ubuntu-latest.
#             Each runner does its own `npm ci` and runs the right
#             `dist:<os>` script. macOS DMGs cannot be cross-built from
#             Windows or Linux (Apple's hdiutil is required), which is
#             why the matrix exists.
#   release — fires on tag push AND on workflow_dispatch. Downloads the
#             per-OS artifacts and attaches them to a draft release. The
#             draft has to be manually published in the GitHub UI before
#             the tag is actually created on the commit, so manual runs
#             with a synthesized tag are safe to discard.
#
# DOUBLE-RUN (fixed 2026-08-03, `guard` job):
#   Publishing a draft is what materializes the tag on the commit, and
#   because a human clicks Publish (not GITHUB_TOKEN), that tag creation
#   DOES emit a `push` event — so every published draft used to kick off a
#   second, fully redundant 3-OS build for a tag whose release already
#   exists and already has every asset attached. Worse, that second run
#   would hand softprops/action-gh-release a tag with a *published*
#   release plus `draft: true`, flipping the freshly published release
#   back to draft and re-uploading assets over it.
#   The `guard` job discriminates the two tag-push cases with one API
#   call: a tag whose release already exists AND already carries assets
#   can only have come from publishing one of our own drafts → skip the
#   whole run. A tag pushed by hand from a clone has no release yet →
#   build normally, so the CLI `git push --tags` path still works.
#   workflow_dispatch always proceeds; it is the deliberate path.
#
# Notes:
#   - All builds are unsigned (no Apple Developer cert, no Authenticode).
#     The corresponding macOS Gatekeeper-bypass instructions live in the
#     top-level README.
#   - prepare-src.js's default already resolves to the repo root from the
#     script's location, but we set AIO_SOURCE_DIR explicitly anyway —
#     the env var is the documented contract and it survives any future
#     refactor of the script's path resolution.
#   - AUTO-UPDATE (opt-in, UI-source/electron/updater.js): installed apps
#     poll this repo's *published* releases via electron-updater. Two build
#     steps below feed that: the version stamp (a DATE-BASED version derived
#     from the release commit by UI-source/scripts/ci-date-version.js — the
#     repo never bumps its checked-in version, and tag names are pure
#     labels: any naming works) and the publish stamp (feed = whichever
#     repo ran this workflow). Publishing the draft is the go-live act —
#     drafts are invisible to installed apps. Publish promptly (the
#     updater's maturity delay counts from BUILD time) and release from
#     the newest commit: versions grow with committer time, clients never
#     downgrade, and GitHub's /releases/latest sorts by the tagged
#     commit's created_at, not by publish time.
# ─────────────────────────────────────────────────────────────────────────────

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    # Manual runs cut a draft release too — and since the app version is
    # date-derived from the commit (not from any tag), a manual draft is
    # every bit as updatable as a tag-push one once published. Either
    # supply the tag name explicitly, or leave it blank and the release
    # job will synthesize `v<date-version>-draft-<UTC timestamp>` so
    # multiple manual runs never collide. The tag is only materialized
    # on the commit when the maintainer clicks "Publish" on the draft.
    inputs:
      tag_name:
        description: 'Tag for the draft release. Any name works — tags are labels; the app version is date-derived from the commit. Leave empty to auto-generate.'
        required: false
        type: string
        default: ''

permissions:
  contents: write  # needed by softprops/action-gh-release to create the draft

jobs:
  # ───────────────────────────────────────────────────────────────────────
  # Duplicate-run filter. Runs in ~10s on a single Linux runner with no
  # checkout (gh api takes the full repos/... path, so no local git needed)
  # and gates BOTH heavy jobs below. See DOUBLE-RUN in the header.
  # ───────────────────────────────────────────────────────────────────────
  guard:
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.decide.outputs.proceed }}
    steps:
      - name: Decide whether this run is a duplicate
        id: decide
        shell: bash
        env:
          # gh CLI is preinstalled on the runner but needs a token; the
          # read is covered by the workflow-level contents: write.
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          # --- knobs -------------------------------------------------------
          # Set to "false" to disable the filter entirely (every tag push
          # builds again, i.e. the pre-2026-08-03 behaviour).
          SKIP_TAGS_FROM_PUBLISHED_DRAFTS=true
          # -----------------------------------------------------------------

          emit() { echo "proceed=$1" >> "$GITHUB_OUTPUT"; echo "$2"; }

          if [ "$EVENT_NAME" != "push" ]; then
            emit true "Event '${EVENT_NAME}' is not a tag push — proceeding."
            exit 0
          fi

          if [ "$SKIP_TAGS_FROM_PUBLISHED_DRAFTS" != "true" ]; then
            emit true "Duplicate filter disabled by knob — proceeding."
            exit 0
          fi

          TAG="${GITHUB_REF#refs/tags/}"

          # /releases/tags/<tag> only ever returns PUBLISHED releases —
          # drafts are not addressable by tag — so a 404 here means "no
          # release owns this tag yet", i.e. a genuinely new hand-pushed tag.
          # Existence alone is the verdict (not asset count): a published
          # release is something this workflow must never touch, since the
          # release job's `draft: true` would UPDATE it back into a draft.
          # Same predicate as "Refuse to overwrite a published release"
          # below, deliberately — the two must never disagree.
          if RELEASE_JSON=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" 2>/dev/null); then
            # Asset count is log decoration only; never fail the guard on it.
            ASSET_COUNT=$(printf '%s' "$RELEASE_JSON" | jq -r '.assets | length' 2>/dev/null || echo '?')
            emit false "Tag ${TAG} is already owned by a published release (${ASSET_COUNT} asset(s)) — this push came from publishing a draft this workflow already built. Skipping the duplicate run."
          else
            emit true "No published release owns tag ${TAG} — fresh tag push, building."
          fi

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Release guard"
            echo "- event: \`${{ github.event_name }}\`"
            echo "- ref: \`${{ github.ref }}\`"
            echo "- proceed: \`${{ steps.decide.outputs.proceed }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: guard
    if: needs.guard.outputs.proceed == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    defaults:
      run:
        working-directory: UI-source

    steps:
      # Action runtimes pinned to majors that ship with Node 24 (see test.yml
      # for the deprecation context). node-version: 20 below is the *Node we
      # build Electron against*, separate from the action runtime — Electron
      # 40 only requires Node 20, no need to bump the build target.
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: UI-source/package-lock.json

      - name: Install npm dependencies
        run: npm ci

      # The repo convention keeps package.json's version static across
      # releases — the version of record is DATE-BASED, derived from the
      # release commit's committer timestamp by scripts/ci-date-version.js
      # (YYYY.MDD.HMM UTC; see that file for the full rationale). Stamp it
      # into package.json before electron-builder runs so BOTH
      # app.getVersion() (baked into the installed app) and latest.yml
      # (the update feed's channel file) carry it. electron-updater then
      # compares those two stamped values — "newest published release vs
      # the release this install came from" — with no repo bumps ever and
      # no dependency on how the release is tagged (tag names here have
      # always been variable — v0.0.5.1, v.0.0.5.2 — and are now pure
      # labels). Unconditional: every run of this workflow is a release
      # build, including workflow_dispatch drafts, which the old
      # tag-derived stamp used to skip, shipping dead 2.0.0 feeds. npm
      # version's strict semver validation backstops the script's own
      # tripwire. Cross-file: UI-source/electron/updater.js.
      - name: Stamp date-based app version
        shell: bash
        run: |
          VER=$(node scripts/ci-date-version.js)
          npm version "$VER" --no-git-tag-version --allow-same-version --ignore-scripts
          echo "Stamped app version ${VER} (from commit $(git log -1 --format='%h, committed %cI'))"

      # Point the embedded update feed (resources/app-update.yml) at the
      # repo that is building the installer, so fork-built installers poll
      # the fork's releases and upstream-built ones poll upstream — no
      # cross-repo coupling. Unconditional, like the version stamp:
      # workflow_dispatch draft builds must also poll their own repo, not
      # the static default in package.json's build.publish (which only
      # covers local `npm run dist:*` builds).
      - name: Point update feed at this repo
        shell: bash
        run: |
          npm pkg set build.publish.provider=github \
            build.publish.owner="${GITHUB_REPOSITORY%%/*}" \
            build.publish.repo="${GITHUB_REPOSITORY##*/}"
          echo "Update feed: github.com/${GITHUB_REPOSITORY}"

      - name: Build installer
        env:
          AIO_SOURCE_DIR: ${{ github.workspace }}
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            npm run dist:win
          elif [ "$RUNNER_OS" = "macOS" ]; then
            npm run dist:mac
          else
            npm run dist:linux
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.os }}-build
          # Installers PLUS the auto-update metadata (reversal of the old
          # "installers only" policy, 2026-07-12): latest*.yml is the
          # channel file installed apps poll to learn the newest version
          # (latest.yml from the Windows job, latest-linux.yml from the
          # AppImage build; macOS emits none — dmg-only + unsigned means
          # no mac auto-update), and *.blockmap enables differential
          # downloads so future updates fetch only changed blocks. Both
          # MUST ride the release or updater clients 404. The Linux job
          # emits BOTH .AppImage and .deb (only the AppImage auto-updates).
          # macOS ships the .dmg only — the redundant zipped-.app target was
          # dropped from UI-source/package.json:build.mac.target.
          path: |
            UI-source/release/*.exe
            UI-source/release/*.dmg
            UI-source/release/*.AppImage
            UI-source/release/*.deb
            UI-source/release/latest*.yml
            UI-source/release/*.blockmap
          if-no-files-found: ignore
          retention-days: 14

  release:
    needs: [guard, build]
    # Fire on tag pushes (the canonical release path) AND manual runs
    # (workflow_dispatch). Without the second clause, a manual run would
    # stop at `build` and leave the artifacts unattached to anything.
    # The guard clause is redundant on paper — a skipped `build` skips this
    # job too — but it is stated explicitly so the "never touch an already
    # published release" invariant is readable here rather than inferred.
    if: >-
      needs.guard.outputs.proceed == 'true' &&
      (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest

    steps:
      # Checkout is needed by "Determine release tag" below so it can run
      # UI-source/scripts/ci-date-version.js on manual runs without an
      # explicit tag input. Cheap (shallow clone, no LFS) and a no-op on
      # tag-push runs that already have the tag in github.ref.
      - uses: actions/checkout@v6

      # download-artifact@v8 errors on hash mismatch by default (was warning
      # in v7). That's the secure default we want — a hash mismatch indicates
      # a corrupted upload-or-transfer and shipping it would be worse than
      # failing loud. No code changes needed for the upgrade in our usage.
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      # Tag-push runs: re-use the pushed ref (refs/tags/<name> → <name>).
      # Manual runs: prefer the user-supplied input; otherwise synthesize
      # v<date-version>-draft-<UTC timestamp> — the same ci-date-version.js
      # output the build jobs stamped into the installers, so the draft's
      # name says what's inside — and repeat manual runs each get a unique
      # draft. softprops/action-gh-release only materializes the tag on
      # the run's commit when the maintainer publishes the draft via the
      # UI, so the synthesized name is safe to throw away if the draft is
      # discarded.
      - name: Determine release tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            INPUT_TAG="${{ inputs.tag_name }}"
            if [ -n "$INPUT_TAG" ]; then
              TAG="$INPUT_TAG"
            else
              VERSION=$(node UI-source/scripts/ci-date-version.js)
              STAMP=$(date -u +%Y%m%d-%H%M%S)
              TAG="v${VERSION}-draft-${STAMP}"
            fi
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Resolved release tag: ${TAG}"

      # Last line of defence for the DOUBLE-RUN invariant: `draft: true`
      # below is an UPDATE, not a create, when a release already owns the
      # tag — so aiming this at a published release would silently
      # unpublish it. The guard job should have skipped the run long
      # before here; this fails loudly if some path ever gets past it
      # (e.g. the knob flipped off, or a tag re-pushed onto a live
      # release). Manual runs with an explicit tag_name hit this too,
      # which is the point: reusing a live tag is never what you want.
      - name: Refuse to overwrite a published release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::Tag ${TAG} already has a PUBLISHED release. Refusing to run softprops/action-gh-release with draft:true, which would flip it back to draft and overwrite its assets. Use a different tag, or delete that release first."
            exit 1
          fi
          echo "No published release owns ${TAG} — safe to create/update a draft."

      # gh-release v3 is the Node 24 line; same API as v2. tag_name is
      # passed explicitly (not inferred from github.ref) so the manual
      # path can supply a synthesized tag without confusing the action.
      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          tag_name: ${{ steps.tag.outputs.tag }}
          files: artifacts/**/*
          generate_release_notes: true