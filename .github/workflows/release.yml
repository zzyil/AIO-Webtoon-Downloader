# ─────────────────────────────────────────────────────────────────────────────
# Release workflow — build the AIO Downloader Electron app on three OSes.
#
# Triggers:
#   - push of any tag matching v*  (cuts a draft GitHub Release)
#   - manual workflow_dispatch     (also cuts a draft release — tag is
#                                   either provided via the `tag_name`
#                                   input or auto-derived from the
#                                   commit's date-version + timestamp)
#
# Jobs:
#   guard   — cheap duplicate-run filter, see DOUBLE-RUN below.
#   build   — matrix over windows-latest / macos-latest / ubuntu-latest.
#             Each runner does its own `npm ci` and runs the right
#             `dist:<os>` script. macOS DMGs cannot be cross-built from
#             Windows or Linux (Apple's hdiutil is required), which is
#             why the matrix exists.
#   android — the Chaquopy port's release APK plus its android-latest.json
#             update feed. Its own job rather than a fourth matrix leg: it
#             shares no step with the Electron builds (Gradle + the Android
#             SDK + a build Python, not npm) and it is the only job that
#             touches signing secrets. `release` NEEDS it, deliberately —
#             see ANDROID below.
#   release — fires on tag push AND on workflow_dispatch. Downloads the
#             per-OS artifacts and attaches them to a draft release. The
#             draft has to be manually published in the GitHub UI before
#             the tag is actually created on the commit, so manual runs
#             with a synthesized tag are safe to discard.
#
# DOUBLE-RUN (fixed 2026-08-03, `guard` job):
#   Publishing a draft is what materializes the tag on the commit, and
#   because a human clicks Publish (not GITHUB_TOKEN), that tag creation
#   DOES emit a `push` event — so every published draft used to kick off a
#   second, fully redundant 3-OS build for a tag whose release already
#   exists and already has every asset attached. Worse, that second run
#   would hand softprops/action-gh-release a tag with a *published*
#   release plus `draft: true`, flipping the freshly published release
#   back to draft and re-uploading assets over it.
#   The `guard` job discriminates the two tag-push cases with one API
#   call: a tag whose release already exists AND already carries assets
#   can only have come from publishing one of our own drafts → skip the
#   whole run. A tag pushed by hand from a clone has no release yet →
#   build normally, so the CLI `git push --tags` path still works.
#   workflow_dispatch always proceeds; it is the deliberate path.
#
# Notes:
#   - All builds are unsigned (no Apple Developer cert, no Authenticode).
#     The corresponding macOS Gatekeeper-bypass instructions live in the
#     top-level README.
#   - prepare-src.js's default already resolves to the repo root from the
#     script's location, but we set AIO_SOURCE_DIR explicitly anyway —
#     the env var is the documented contract and it survives any future
#     refactor of the script's path resolution.
#   - AUTO-UPDATE (opt-in, UI-source/electron/updater.js): installed apps
#     poll this repo's *published* releases via electron-updater. Two build
#     steps below feed that: the version stamp (a DATE-BASED version derived
#     from the release commit by UI-source/scripts/ci-date-version.js — the
#     repo never bumps its checked-in version, and tag names are pure
#     labels: any naming works) and the publish stamp (feed = whichever
#     repo ran this workflow). Publishing the draft is the go-live act —
#     drafts are invisible to installed apps. Publish promptly (the
#     updater's maturity delay counts from BUILD time) and release from
#     the newest commit: versions grow with committer time, clients never
#     downgrade, and GitHub's /releases/latest sorts by the tagged
#     commit's created_at, not by publish time.
#   - ANDROID (opt-in self-update, android/app/src/main/java/com/aio/downloader/
#     core/AppUpdater.kt): the APK's own updater polls
#     /releases/latest/download/android-latest.json on whichever repo built it,
#     the same "feed = the building repo" rule the Electron half uses. That feed
#     file is written by the `android` job below, and ONLY when a real release
#     keystore was available — its absence is the signal that installed apps
#     must not try to update, because a debug-signed APK can never install over
#     a differently-signed one. Version and applicability facts all come from
#     `./gradlew -q :app:printVersion`; this workflow never restates them.
#
#     `release` NEEDS the android job, so a red Android build blocks the draft.
#     That is the same policy the desktop matrix already has (a failed macOS leg
#     fails `build` and skips `release`) and it is chosen over shipping a
#     release that silently lacks the APK. To ship around a broken Android
#     build, remove `android` from the release job's `needs:` in a branch — do
#     not add a skip input: a SKIPPED job in `needs` skips the dependent job
#     too, so an input would take the draft down with it.
# ─────────────────────────────────────────────────────────────────────────────

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    # Manual runs cut a draft release too — and since the app version is
    # date-derived from the commit (not from any tag), a manual draft is
    # every bit as updatable as a tag-push one once published. Either
    # supply the tag name explicitly, or leave it blank and the release
    # job will synthesize `v<date-version>-draft-<UTC timestamp>` so
    # multiple manual runs never collide. The tag is only materialized
    # on the commit when the maintainer clicks "Publish" on the draft.
    inputs:
      tag_name:
        description: 'Tag for the draft release. Any name works — tags are labels; the app version is date-derived from the commit. Leave empty to auto-generate.'
        required: false
        type: string
        default: ''

permissions:
  contents: write  # needed by softprops/action-gh-release to create the draft

jobs:
  # ───────────────────────────────────────────────────────────────────────
  # Duplicate-run filter. Runs in ~10s on a single Linux runner with no
  # checkout (gh api takes the full repos/... path, so no local git needed)
  # and gates BOTH heavy jobs below. See DOUBLE-RUN in the header.
  # ───────────────────────────────────────────────────────────────────────
  guard:
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.decide.outputs.proceed }}
    steps:
      - name: Decide whether this run is a duplicate
        id: decide
        shell: bash
        env:
          # gh CLI is preinstalled on the runner but needs a token; the
          # read is covered by the workflow-level contents: write.
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          # --- knobs -------------------------------------------------------
          # Set to "false" to disable the filter entirely (every tag push
          # builds again, i.e. the pre-2026-08-03 behaviour).
          SKIP_TAGS_FROM_PUBLISHED_DRAFTS=true
          # -----------------------------------------------------------------

          emit() { echo "proceed=$1" >> "$GITHUB_OUTPUT"; echo "$2"; }

          if [ "$EVENT_NAME" != "push" ]; then
            emit true "Event '${EVENT_NAME}' is not a tag push — proceeding."
            exit 0
          fi

          if [ "$SKIP_TAGS_FROM_PUBLISHED_DRAFTS" != "true" ]; then
            emit true "Duplicate filter disabled by knob — proceeding."
            exit 0
          fi

          TAG="${GITHUB_REF#refs/tags/}"

          # /releases/tags/<tag> only ever returns PUBLISHED releases —
          # drafts are not addressable by tag — so a 404 here means "no
          # release owns this tag yet", i.e. a genuinely new hand-pushed tag.
          # Existence alone is the verdict (not asset count): a published
          # release is something this workflow must never touch, since the
          # release job's `draft: true` would UPDATE it back into a draft.
          # Same predicate as "Refuse to overwrite a published release"
          # below, deliberately — the two must never disagree.
          if RELEASE_JSON=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" 2>/dev/null); then
            # Asset count is log decoration only; never fail the guard on it.
            ASSET_COUNT=$(printf '%s' "$RELEASE_JSON" | jq -r '.assets | length' 2>/dev/null || echo '?')
            emit false "Tag ${TAG} is already owned by a published release (${ASSET_COUNT} asset(s)) — this push came from publishing a draft this workflow already built. Skipping the duplicate run."
          else
            emit true "No published release owns tag ${TAG} — fresh tag push, building."
          fi

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Release guard"
            echo "- event: \`${{ github.event_name }}\`"
            echo "- ref: \`${{ github.ref }}\`"
            echo "- proceed: \`${{ steps.decide.outputs.proceed }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: guard
    if: needs.guard.outputs.proceed == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    defaults:
      run:
        working-directory: UI-source

    steps:
      # Action runtimes pinned to majors that ship with Node 24 (see test.yml
      # for the deprecation context). node-version: 20 below is the *Node we
      # build Electron against*, separate from the action runtime — Electron
      # 40 only requires Node 20, no need to bump the build target.
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: UI-source/package-lock.json

      - name: Install npm dependencies
        run: npm ci

      # The repo convention keeps package.json's version static across
      # releases — the version of record is DATE-BASED, derived from the
      # release commit's committer timestamp by scripts/ci-date-version.js
      # (YYYY.MDD.HMM UTC; see that file for the full rationale). Stamp it
      # into package.json before electron-builder runs so BOTH
      # app.getVersion() (baked into the installed app) and latest.yml
      # (the update feed's channel file) carry it. electron-updater then
      # compares those two stamped values — "newest published release vs
      # the release this install came from" — with no repo bumps ever and
      # no dependency on how the release is tagged (tag names here have
      # always been variable — v0.0.5.1, v.0.0.5.2 — and are now pure
      # labels). Unconditional: every run of this workflow is a release
      # build, including workflow_dispatch drafts, which the old
      # tag-derived stamp used to skip, shipping dead 2.0.0 feeds. npm
      # version's strict semver validation backstops the script's own
      # tripwire. Cross-file: UI-source/electron/updater.js.
      - name: Stamp date-based app version
        shell: bash
        run: |
          VER=$(node scripts/ci-date-version.js)
          npm version "$VER" --no-git-tag-version --allow-same-version --ignore-scripts
          echo "Stamped app version ${VER} (from commit $(git log -1 --format='%h, committed %cI'))"

      # Point the embedded update feed (resources/app-update.yml) at the
      # repo that is building the installer, so fork-built installers poll
      # the fork's releases and upstream-built ones poll upstream — no
      # cross-repo coupling. Unconditional, like the version stamp:
      # workflow_dispatch draft builds must also poll their own repo, not
      # the static default in package.json's build.publish (which only
      # covers local `npm run dist:*` builds).
      - name: Point update feed at this repo
        shell: bash
        run: |
          npm pkg set build.publish.provider=github \
            build.publish.owner="${GITHUB_REPOSITORY%%/*}" \
            build.publish.repo="${GITHUB_REPOSITORY##*/}"
          echo "Update feed: github.com/${GITHUB_REPOSITORY}"

      - name: Build installer
        env:
          AIO_SOURCE_DIR: ${{ github.workspace }}
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            npm run dist:win
          elif [ "$RUNNER_OS" = "macOS" ]; then
            npm run dist:mac
          else
            npm run dist:linux
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.os }}-build
          # Installers PLUS the auto-update metadata (reversal of the old
          # "installers only" policy, 2026-07-12): latest*.yml is the
          # channel file installed apps poll to learn the newest version
          # (latest.yml from the Windows job, latest-linux.yml from the
          # AppImage build; macOS emits none — dmg-only + unsigned means
          # no mac auto-update), and *.blockmap enables differential
          # downloads so future updates fetch only changed blocks. Both
          # MUST ride the release or updater clients 404. The Linux job
          # emits BOTH .AppImage and .deb (only the AppImage auto-updates).
          # macOS ships the .dmg only — the redundant zipped-.app target was
          # dropped from UI-source/package.json:build.mac.target.
          path: |
            UI-source/release/*.exe
            UI-source/release/*.dmg
            UI-source/release/*.AppImage
            UI-source/release/*.deb
            UI-source/release/latest*.yml
            UI-source/release/*.blockmap
          if-no-files-found: ignore
          retention-days: 14

  # ───────────────────────────────────────────────────────────────────────
  # The Chaquopy Android port. Gated on the SAME guard as `build` — without
  # `needs: guard` this would reintroduce for Android exactly the double-build
  # the guard job exists to prevent (see DOUBLE-RUN in the header).
  #
  # The toolchain traps this job walks around are documented once, in
  # .github/workflows/android.yml's header (JDK 17-21 for AGP 8.13; Chaquopy's
  # buildPython must be the 3.13 that `chaquopy { version }` names, not the
  # runner's distro python3). That workflow is the pre-merge sibling of this
  # job; keep the two toolchain step-sets in step.
  # ───────────────────────────────────────────────────────────────────────
  android:
    needs: guard
    if: needs.guard.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      # JOB level, deliberately: Chaquopy reads the ABI set from
      # android.defaultConfig, so it cannot be a per-build-type value (see the
      # ABIs block in android/app/build.gradle.kts — the build-type version of
      # this silently ships x86_64 native libs with no x86_64 Python runtime).
      # Every step therefore has to see the same value, or assembleRelease and
      # printVersion would disagree about what the feed's `abis` field means.
      # Real devices are arm64; x86_64 is the emulator, and dropping it takes
      # the APK from 76.79 MB to 50.24 MB (measured, both variants).
      AIO_ABIS: arm64-v8a
      # The Android half of "Point update feed at this repo": a fork-built APK
      # polls the fork's releases, upstream's polls upstream's.
      AIO_UPDATE_FEED_REPO: ${{ github.repository }}

    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - uses: actions/setup-python@v6
        id: buildpython
        with:
          python-version: "3.13"

      - name: Ensure the compileSdk platform is installed
        run: |
          set -eu
          SDKMANAGER="$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n1 || true)"
          if [ -z "$SDKMANAGER" ]; then
            echo "No sdkmanager on this image; relying on AGP's own SDK download."
            exit 0
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" || \
            echo "::warning::sdkmanager could not install platforms;android-36 — AGP will try."

      # ── signing ──────────────────────────────────────────────────────────
      # There is no keystore in the repo and there never will be. Four secrets
      # supply one; all four or none.
      #
      #   ANDROID_KEYSTORE_BASE64    base64 of a PKCS12 .jks
      #   ANDROID_KEYSTORE_PASSWORD
      #   ANDROID_KEY_ALIAS
      #   ANDROID_KEY_PASSWORD
      #
      # Absent (an unconfigured repo, or any fork), the build falls back to the
      # DEBUG key so the APK still installs — an unsigned APK cannot be
      # installed at all, so "unsigned but honest" is just a broken artifact.
      # What it loses is self-update, and that loss is enforced in two places:
      # BuildConfig.RELEASE_SIGNED is false, and the feed-writing step below
      # refuses to emit android-latest.json. Both are deliberate: AGP's debug
      # keystore is generated per machine, so two runs produce two keys and
      # Android refuses to replace an app signed with a different one.
      - name: Decode the release keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -eu
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret. The release APK will be DEBUG-SIGNED, no android-latest.json will be published, and installed apps will not offer an update to it."
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/aio-release.jks"
          # A truncated or mis-pasted secret decodes to garbage that only fails
          # inside apksigner, with a message that reads like file corruption.
          if [ ! -s "$RUNNER_TEMP/aio-release.jks" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 decoded to an empty file."
            exit 1
          fi
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Unit tests and release APK
        env:
          AIO_BUILD_PYTHON: ${{ steps.buildpython.outputs.python-path }}
          # Empty string when unsigned — app/build.gradle.kts treats a blank or
          # missing path as "no release keystore" and falls back to the debug
          # signing config.
          AIO_KEYSTORE_FILE: ${{ steps.keystore.outputs.signed == 'true' && format('{0}/aio-release.jks', runner.temp) || '' }}
          AIO_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          AIO_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          AIO_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew --console=plain --no-daemon \
            :app:testDebugUnitTest \
            :app:assembleRelease

      # Everything factual about the build comes from Gradle, never from a
      # second implementation in bash — grep printVersion in
      # android/app/build.gradle.kts for why. Read with grep rather than eval:
      # Gradle may put its own notices on stdout and this must not execute them.
      - name: Name the APK and write the update feed
        id: package
        env:
          AIO_BUILD_PYTHON: ${{ steps.buildpython.outputs.python-path }}
          AIO_KEYSTORE_FILE: ${{ steps.keystore.outputs.signed == 'true' && format('{0}/aio-release.jks', runner.temp) || '' }}
          AIO_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          AIO_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          AIO_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SIGNED: ${{ steps.keystore.outputs.signed }}
        run: |
          set -euo pipefail

          ./gradlew -q --console=plain --no-daemon :app:printVersion > "$RUNNER_TEMP/version.txt"
          field() { grep -m1 "^$1=" "$RUNNER_TEMP/version.txt" | cut -d= -f2-; }
          VERSION="$(field versionName)"
          VERSION_CODE="$(field versionCode)"
          MIN_SDK="$(field minSdk)"
          ABIS="$(field abis)"
          [ -n "$VERSION" ] && [ -n "$VERSION_CODE" ]

          SRC="$(ls app/build/outputs/apk/release/*.apk | head -n1)"
          OUT="$RUNNER_TEMP/android-release"
          mkdir -p "$OUT"

          # Dash-separated, never spaces: GitHub rewrites spaces in release
          # ASSET names to dots while any feed that recorded dashes keeps them,
          # which 404s every download. Same rule as package.json's
          # nsis.artifactName / appImage.artifactName.
          APK="AIO-Downloader-${VERSION}.apk"
          cp "$SRC" "$OUT/$APK"

          SHA="$(sha256sum "$OUT/$APK" | cut -d' ' -f1)"
          SIZE="$(stat -c%s "$OUT/$APK")"

          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "out=$OUT" >> "$GITHUB_OUTPUT"

          if [ "$SIGNED" != "true" ]; then
            echo "::warning::Debug-signed build — android-latest.json is NOT being written, so no installed app will offer this as an update."
          else
            # apksigner, NOT `keytool -printcert -jarfile`. AGP turns v1 (JAR)
            # signing OFF when minSdk >= 24, so the APK carries only the v2/v3
            # APK Signature Scheme block — which keytool cannot read: it prints
            # "Not a signed jar file" AND EXITS 0. apksigner reads the real
            # block, fails the step if the APK is not properly signed, and
            # already prints the digest as lowercase hex with no colons, which
            # is exactly the form AppUpdater derives from PackageManager.
            APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -n1)"
            if [ -z "$APKSIGNER" ]; then
              echo "::error::No apksigner under \$ANDROID_HOME/build-tools — cannot record the signing certificate the update feed needs."
              exit 1
            fi
            # Matched on the digest itself, not on the line's prefix, because
            # the prefix is NOT stable across build-tools versions — 36.0.0
            # prints "Signer #1 certificate SHA-256 digest: <hex>" and 37.0.0
            # prints "V2 Signer: certificate SHA-256 digest: <hex>" (measured on
            # both). Since the glob above takes the HIGHEST installed version,
            # a prefix match silently yields an empty digest the day a runner
            # image adds a newer build-tools. Extracting the 64-hex token is
            # also self-validating. A single signing config produces the same
            # certificate under every scheme, so the first match is the answer.
            SIGNING="$("$APKSIGNER" verify --print-certs "$OUT/$APK" \
              | grep -m1 -oE 'SHA-256 digest: *[0-9a-fA-F]{64}' \
              | grep -oE '[0-9a-fA-F]{64}' | tr 'A-Z' 'a-z')"
            if [ ${#SIGNING} -ne 64 ]; then
              echo "::error::Could not read the signing certificate digest (got '${SIGNING}')."
              exit 1
            fi

            # releaseDate is stamped at BUILD time, exactly like
            # electron-builder's, so both apps' maturity delays share one clock
            # and one caveat: a draft left unpublished eats into the window.
            jq -n \
              --argjson schema 1 \
              --argjson versionCode "$VERSION_CODE" \
              --arg versionName "$VERSION" \
              --arg releaseDate "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              --arg apk "$APK" \
              --argjson size "$SIZE" \
              --arg sha256 "$SHA" \
              --argjson minSdk "$MIN_SDK" \
              --arg abis "$ABIS" \
              --arg signingSha256 "$SIGNING" \
              '{schema:$schema, versionCode:$versionCode, versionName:$versionName,
                releaseDate:$releaseDate, apk:$apk, size:$size, sha256:$sha256,
                minSdk:$minSdk, abis:($abis | split(",")), signingSha256:$signingSha256}' \
              > "$OUT/android-latest.json"
            cat "$OUT/android-latest.json"
          fi

          {
            echo "### Android"
            echo "- version: \`${VERSION}\` (code \`${VERSION_CODE}\`)"
            echo "- apk: \`${APK}\` ($(numfmt --to=iec "$SIZE"), abis \`${ABIS}\`, minSdk \`${MIN_SDK}\`)"
            echo "- release-signed: \`${SIGNED}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: android-build
          # The APK and, when it exists, the update feed. android-latest.json is
          # the Android analogue of latest.yml and MUST ride the release or the
          # in-app updater 404s on every check.
          path: ${{ steps.package.outputs.out }}
          if-no-files-found: error
          retention-days: 14

  release:
    needs: [guard, build, android]
    # Fire on tag pushes (the canonical release path) AND manual runs
    # (workflow_dispatch). Without the second clause, a manual run would
    # stop at `build` and leave the artifacts unattached to anything.
    # The guard clause is redundant on paper — a skipped `build` skips this
    # job too — but it is stated explicitly so the "never touch an already
    # published release" invariant is readable here rather than inferred.
    # `android` joined `needs` for the same reason `build` is there: every
    # artifact-producing job must succeed or no draft is cut. See ANDROID in
    # the header for why that is a hard dependency rather than a skippable one.
    if: >-
      needs.guard.outputs.proceed == 'true' &&
      (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest

    steps:
      # Checkout is needed by "Determine release tag" below so it can run
      # UI-source/scripts/ci-date-version.js on manual runs without an
      # explicit tag input. Cheap (shallow clone, no LFS) and a no-op on
      # tag-push runs that already have the tag in github.ref.
      - uses: actions/checkout@v6

      # download-artifact@v8 errors on hash mismatch by default (was warning
      # in v7). That's the secure default we want — a hash mismatch indicates
      # a corrupted upload-or-transfer and shipping it would be worse than
      # failing loud. No code changes needed for the upgrade in our usage.
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      # Tag-push runs: re-use the pushed ref (refs/tags/<name> → <name>).
      # Manual runs: prefer the user-supplied input; otherwise synthesize
      # v<date-version>-draft-<UTC timestamp> — the same ci-date-version.js
      # output the build jobs stamped into the installers, so the draft's
      # name says what's inside — and repeat manual runs each get a unique
      # draft. softprops/action-gh-release only materializes the tag on
      # the run's commit when the maintainer publishes the draft via the
      # UI, so the synthesized name is safe to throw away if the draft is
      # discarded.
      - name: Determine release tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            INPUT_TAG="${{ inputs.tag_name }}"
            if [ -n "$INPUT_TAG" ]; then
              TAG="$INPUT_TAG"
            else
              VERSION=$(node UI-source/scripts/ci-date-version.js)
              STAMP=$(date -u +%Y%m%d-%H%M%S)
              TAG="v${VERSION}-draft-${STAMP}"
            fi
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Resolved release tag: ${TAG}"

      # Last line of defence for the DOUBLE-RUN invariant: `draft: true`
      # below is an UPDATE, not a create, when a release already owns the
      # tag — so aiming this at a published release would silently
      # unpublish it. The guard job should have skipped the run long
      # before here; this fails loudly if some path ever gets past it
      # (e.g. the knob flipped off, or a tag re-pushed onto a live
      # release). Manual runs with an explicit tag_name hit this too,
      # which is the point: reusing a live tag is never what you want.
      - name: Refuse to overwrite a published release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::Tag ${TAG} already has a PUBLISHED release. Refusing to run softprops/action-gh-release with draft:true, which would flip it back to draft and overwrite its assets. Use a different tag, or delete that release first."
            exit 1
          fi
          echo "No published release owns ${TAG} — safe to create/update a draft."

      # gh-release v3 is the Node 24 line; same API as v2. tag_name is
      # passed explicitly (not inferred from github.ref) so the manual
      # path can supply a synthesized tag without confusing the action.
      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          tag_name: ${{ steps.tag.outputs.tag }}
          files: artifacts/**/*
          generate_release_notes: true